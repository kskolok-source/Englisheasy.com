<style>
:root {
  --ink: #202b43;
  --muted: #647087;
  --cream: #fbf8f1;
  --blue: #dcecff;
  --yellow: #ffd65a;
  --mint: #d9f3e7;
  --purple: #e8e0ff;
  --line: #e8e7e1;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }

.container {
  width: min(1120px, 92%);
  margin: auto;
}

header { padding: 20px 0; }

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  white-space: nowrap;
}

.logo span { color: #7185ca; }

.navlinks {
  display: flex;
  gap: 22px;
  font-size: 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 20px;
  border: 0;
  border-radius: 30px;
  background: var(--ink);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.btn:hover { transform: translateY(-2px); }

.btn.yellow {
  background: var(--yellow);
  color: var(--ink);
}

.btn.white {
  background: white;
  color: var(--ink);
  border: 1px solid var(--line);
}

/* Главный экран */

.hero { padding: 65px 0 75px; }

.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 40px;
  align-items: center;
}

.eyebrow {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 30px;
  background: white;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(42px, 6vw, 70px);
  line-height: 1;
  letter-spacing: -3px;
  margin: 24px 0;
}

h1 em {
  font-style: normal;
  color: #647ac0;
}

.hero p {
  font-size: 18px;
  line-height: 1.7;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.stats {
  display: flex;
  gap: 30px;
  margin-top: 30px;
}

.stats strong {
  display: block;
  font-size: 22px;
}

.stats small { color: var(--muted); }

/* Декоративная иллюстрация */

  min-height: 370px;
  border-radius: 35px;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
